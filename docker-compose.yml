services:
  product-scraper:
    build: .
    ports:
      - "8000:8000"
    environment:
      SCRAPER_DATA_DIR: /app/data
      CORS_ALLOW_ORIGINS: "*"
      SUPERBED_UPLOAD_URL: "${SUPERBED_UPLOAD_URL:-https://api.superbed.cc/upload}"
      SUPERBED_TOKEN: "${SUPERBED_TOKEN:-}"
      SUPERBED_CATEGORIES: "${SUPERBED_CATEGORIES:-}"
      ALI_OSS_ACCESS_KEY_ID: "${ALI_OSS_ACCESS_KEY_ID:-}"
      ALI_OSS_ACCESS_KEY_SECRET: "${ALI_OSS_ACCESS_KEY_SECRET:-}"
      ALI_OSS_ENDPOINT: "${ALI_OSS_ENDPOINT:-}"
      ALI_OSS_BUCKET: "${ALI_OSS_BUCKET:-}"
      ALI_OSS_PUBLIC_BASE_URL: "${ALI_OSS_PUBLIC_BASE_URL:-}"
      ALI_OSS_PREFIX: "${ALI_OSS_PREFIX:-product-scraper}"
    volumes:
      - scraper-data:/app/data
    restart: unless-stopped

volumes:
  scraper-data:
