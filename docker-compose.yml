services:
  product-scraper:
    build: .
    ports:
      - "8000:8000"
    environment:
      SCRAPER_DATA_DIR: /app/data
      CORS_ALLOW_ORIGINS: "*"
      SCRAPE_CONCURRENCY: 3
      RENDER_CONCURRENCY: 2
      IMAGE_UPLOAD_CONCURRENCY: 6
      IMAGE_UPLOAD_TOTAL_CONCURRENCY: 12
    volumes:
      - scraper-data:/app/data
    restart: unless-stopped

volumes:
  scraper-data:
